<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Guide</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

    <!--     Navbar    -->
    <nav>
        <div class="navbar">
            <div class="logo">
                <h1>Movie Guide App</h1>
            </div>
            <div class="search-container">
                <form action="">
                    <input type="text" placeholder="Search Movie" class="inputBox"/> 
                    <button type="submit" class="searchBtn">Search</button>
                </form>
            </div>
            
        </div>
    </nav>

        <!--     Main Section of Movie data    -->
             <main>
                <section>

                    <div class="movie-container">
                       
                        <div class="main-heading">
                              <h2>Discover Your Next Favorite Movie</h2>
                              <p>Explore cast lists, release dates, plot summaries, and ratings for thousands of films. Just type a title to get started!</p>
                        </div>
                            <div class="movie-poster"></div>
                            <div class="movie-details"></div>
                    </div>
                </section>
             </main>

       <!--     Main Section of Movie data    -->
            <footer>
                <p>&copy: 2023 Movie Guide App</p>
            </footer>

 
    
</body>     

  <script src="script.js"></script>
</html>
